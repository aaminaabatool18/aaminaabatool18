name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: aaminaabatool18
          outputs: |
            dist/github-snake.svg?color_snake=C084FC&color_dots=161616,2E1065,6D28D9,A855F7,C084FC
            dist/github-snake-dark.svg?color_snake=FFFFFF&color_dots=111111,2E1065,6D28D9,A855F7,C084FC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
